name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[dev]"
      - run: make lint
      - run: make test

  # RNF-02 / RNF-05: brings up the Docker Compose environment and proves Spark writes and reads Delta on MinIO.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Local-development/CI credentials only (ephemeral containers); they are not secrets.
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    steps:
      - uses: actions/checkout@v4
      - name: Docker versions
        run: docker version --format '{{.Server.Version}}' && docker compose version
      - name: make up
        run: make up
      - name: Service status
        run: make ps
      - name: make smoke
        run: make smoke
      - name: Service logs
        if: always()
        run: make logs
      - name: make down
        if: always()
        run: make down V=1
