name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[dev]"
      - run: make lint
      - run: make test

  # RNF-02 / RNF-05: brings up the Docker Compose environment and proves Spark writes and reads Delta on MinIO.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Local-development/CI credentials only (ephemeral containers); they are not secrets.
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    steps:
      - uses: actions/checkout@v4
      - name: Docker versions
        run: docker version --format '{{.Server.Version}}' && docker compose version
      - name: make up
        run: make up
      - name: Service status
        run: make ps
      - name: make smoke
        run: make smoke
      - name: Service logs
        if: always()
        run: make logs
      - name: make down
        if: always()
        run: make down V=1

  # RF-02 / RF-03 / ADR 006: ingests a real release subset into bronze (Delta on MinIO), proves
  # that the bronze row counts equal the source line counts, then builds silver from it and proves
  # that no business key is duplicated. Only counts are published (RST-01).
  bronze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      COMPETENCIA: "2026-09"
      # Empresas1 is ~90 MB zipped; the lookup tables are a few KB (docs/data-source.md).
      FILES: "lookups Empresas1"
      # The row-count proof needs every row: no sampling (RNF-03).
      SPARK_SAMPLE_FRACTION: "1.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the package
        run: pip install -e .
      - name: make download
        run: make download COMPETENCIA="$COMPETENCIA" FILES="$FILES" && df -h .
      - name: make up
        run: make up
      - name: make bronze (every downloaded table)
        run: make bronze COMPETENCIA="$COMPETENCIA"
      - name: make bronze again (re-run replaces the partition, no duplicates)
        run: make bronze COMPETENCIA="$COMPETENCIA" TABLES="cnaes motivos"
      - name: make bronze-check (source lines == bronze rows)
        run: make bronze-check COMPETENCIA="$COMPETENCIA"
      - name: make silver (every bronze table)
        run: make silver COMPETENCIA="$COMPETENCIA"
      - name: make silver-check (no duplicated business key, dates typed, counts reconciled)
        run: make silver-check COMPETENCIA="$COMPETENCIA"
      # RF-04 / ADR 011: re-running the month merges nothing; a synthetic next month derived from
      # the same bronze (no download) updates the changed keys and inserts the new ones.
      - name: make silver again (RF-04, same month -> 0 inserted, 0 updated)
        run: |
          # build/ is written by the containers (root)
          sudo cp "build/silver-${COMPETENCIA}.json" "build/silver-${COMPETENCIA}-first.json"
          make silver COMPETENCIA="$COMPETENCIA"
          jq -e '[.tables[] | select(.operation != "merge" or .rows_inserted != 0
            or .rows_updated != 0)] | length == 0' "build/silver-${COMPETENCIA}.json"
      # RF-06: records the aggregates of the current silver version right after the run, so the
      # time travel demo can prove that `versionAsOf` N-1 reproduces them after the next month.
      - name: Record silver empresas before the next month (RF-06)
        run: make time-travel TT_ARGS="--snapshot build/time-travel-${COMPETENCIA}.json"
      - name: Synthetic next month in bronze (RF-04, derived from the same month)
        run: >-
          docker compose -f infra/docker-compose.yml --profile client run --rm spark-client
          python scripts/silver_next_month.py --source "$COMPETENCIA" --target 2026-10
          --table empresas --column razao_social --out build/next-month.json
      - name: make silver next month (RF-04, updated and inserted as expected, no duplicates)
        run: |
          make silver COMPETENCIA=2026-10 TABLES=empresas
          make silver-check COMPETENCIA=2026-10 && sudo cp -r build/silver-check build/silver-check-2026-10
          jq -e --slurpfile e build/next-month.json \
            --slurpfile f "build/silver-${COMPETENCIA}-first.json" '
            .tables[0] as $t | ($f[0].tables[] | select(.table == "empresas")) as $p
            | $t.rows_updated == $e[0].expected_updated and $t.rows_updated > 0
            and $t.rows_inserted == $e[0].expected_inserted and $t.rows_inserted > 0
            and $t.table_rows == $p.table_rows + $t.rows_inserted' build/silver-2026-10.json
          cat build/silver-check-2026-10/silver-check.md >> "$GITHUB_STEP_SUMMARY"
      - name: make time-travel (RF-06, history, versionAsOf N-1 vs N, timestampAsOf)
        run: |
          make time-travel TT_ARGS="--expected build/time-travel-${COMPETENCIA}.json"
          cat build/time-travel/time-travel.md >> "$GITHUB_STEP_SUMMARY"
      - name: Summary
        if: always()
        run: |
          cat build/bronze-check/bronze-check.md >> "$GITHUB_STEP_SUMMARY" || true
          cat build/silver-check/silver-check.md >> "$GITHUB_STEP_SUMMARY" || true
          cat "build/bronze-${COMPETENCIA}.json" build/bronze-check/bronze-check.json || true
          cat "build/silver-${COMPETENCIA}.json" build/silver-check/silver-check.json || true
      - name: Upload counts (no data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bronze-counts-${{ env.COMPETENCIA }}
          path: |
            build/bronze-${{ env.COMPETENCIA }}.json
            build/bronze-check/
            build/silver-*.json
            build/next-month.json
            build/silver-check*/
            build/time-travel*
          retention-days: 30
          if-no-files-found: warn
      - name: Service logs
        if: always()
        run: make logs
      - name: make down
        if: always()
        run: make down V=1
