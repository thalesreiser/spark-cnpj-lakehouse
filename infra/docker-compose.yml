# RNF-02: ambiente completo local (Spark master + worker + MinIO), sem nuvem paga.
# RNF-05: versões fixadas (imagem Spark própria em infra/spark, tags exatas do MinIO).
# Use pelo Makefile (`make up`, `make smoke`, `make down`); variáveis opcionais no `.env`.
name: cnpj-lakehouse

x-spark-image: &spark-image
  image: cnpj-lakehouse/spark:3.5.3
  build:
    context: ..
    dockerfile: infra/spark/Dockerfile

services:
  minio:
    # Fork comunitário mantido do MinIO (as imagens oficiais saíram do Docker Hub; ver ADR 005).
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    command: server /data --console-address ":9001"
    environment:
      # Credenciais apenas de desenvolvimento local; sobrescreva no .env.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 24

  minio-init:
    # Cria o bucket do lakehouse na subida (idempotente).
    image: ${MC_IMAGE:-pgsty/mc:RELEASE.2026-09-16T00-00-00Z}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$LAKEHOUSE_BUCKET" &&
        mc ls local
    restart: "no"

  spark-master:
    <<: *spark-image
    hostname: spark-master
    command:
      - spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports: ["8080:8080", "7077:7077"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/json/"]
      interval: 5s
      timeout: 5s
      retries: 24

  spark-worker:
    <<: *spark-image
    hostname: spark-worker
    depends_on:
      spark-master:
        condition: service_healthy
    command:
      - bash
      - -c
      - >-
        exec spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
        --host spark-worker --webui-port 8081
        --cores "$${SPARK_WORKER_CORES}" --memory "$${SPARK_WORKER_MEMORY}"
    environment:
      # Padrão modesto para máquinas com ~8 GB de RAM; ajuste no .env.
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
    ports: ["8081:8081"]
    healthcheck:
      # Saudável quando o worker estiver registrado (ALIVE) no master.
      test:
        - CMD-SHELL
        - 'curl -fsS http://spark-master:8080/json/ | grep -Eq "\"aliveworkers\" ?: ?[1-9]"'
      interval: 5s
      timeout: 5s
      retries: 24

  spark-client:
    # Driver das aplicações (smoke test, pipeline): mesma imagem dos executores.
    <<: *spark-image
    profiles: ["cliente"]
    depends_on:
      spark-worker:
        condition: service_healthy
      minio:
        condition: service_healthy
    working_dir: /opt/app
    volumes: ["..:/opt/app"]
    entrypoint: ["bash", "/opt/app/infra/spark/entrypoint-cliente.sh"]
    environment:
      PYTHONPATH: /opt/app/src
      SPARK_MASTER_URL: spark://spark-master:7077
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
      SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:-1g}
      SPARK_SAMPLE_FRACTION: ${SPARK_SAMPLE_FRACTION:-1.0}

volumes:
  minio-data:
