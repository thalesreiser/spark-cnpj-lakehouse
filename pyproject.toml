[project]
name = "cnpj-lakehouse"
version = "0.1.0"
description = "Lakehouse with Spark and Delta Lake on Brazilian CNPJ open data"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pyspark==3.5.3",
  "delta-spark==3.2.1",
  "requests>=2.33",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "chispa>=0.10", "ruff>=0.6", "black>=24", "mypy>=1.11", "types-requests>=2.32", "pre-commit>=3.8"]
# Task 5.3: executes notebooks/02-business-questions.ipynb (manual `Gold analysis` workflow).
notebooks = ["pandas>=2.2", "matplotlib>=3.8", "nbconvert>=7.16", "ipykernel>=6.29"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=cnpj_lakehouse --cov-report=term-missing"
markers = [
  "integration: requires the Docker environment",
  "delta: needs the Delta jars in a fresh JVM (own pytest run, see `make test`)",
]
